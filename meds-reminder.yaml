blueprint:
  name: Notify if sensor not triggered in 2 hours (8AM)
  description: Sends a notification at 8:00 AM if the selected sensor has not changed state in the past 2 hours.
  domain: automation
  input:
    sensor:
      name: Sensor to monitor
      selector:
        entity:
          domain: binary_sensor
    notify_service:
      name: Notification service
      description: Enter the notification service name (e.g., notify.mobile_app_iphone). Find it in Developer Tools > Services.
      default: notify.mobile_app_
      selector:
        text:
    message:
      name: Notification message
      default: "Take your meds!"
      selector:
        text:
    debug:
      name: Enable debug logging
      description: Log debug information to Home Assistant logs
      default: false
      selector:
        boolean:

trigger:
  - platform: time
    at: "08:00:00"

condition:
  - condition: template
    value_template: >
      {% set sensor_state = states[input.sensor] %}
      {% if sensor_state is none or sensor_state.last_changed is none %}
        {{ false }}
      {% else %}
        {% set last_changed = sensor_state.last_changed %}
        {% set now = now() %}
        {% set time_diff = (now - last_changed).total_seconds() %}
        {% if input.debug %}
          {{ log("DEBUG: Sensor: " ~ input.sensor ~ ", Last changed: " ~ last_changed ~ ", Time diff (seconds): " ~ time_diff, level="INFO") }}
        {% endif %}
        {{ time_diff > 7200 }}
      {% endif %}

action:
  # Log debug info if enabled
  - if:
      - condition: template
        value_template: "{{ input.debug }}"
    then:
      - service: system_log.write
        data:
          message: >
            Medication Reminder: Sensor {{ input.sensor }} has not changed
            in {{ ((now() - states[input.sensor].last_changed).total_seconds() / 3600) | round(2) }} hours.
            Sending notification.
          level: info
  # Send notification
  - service: !input notify_service
    data:
      message: !input message
      title: "Sensor Inactivity Alert"
      data:
        actions:
          - action: "DISMISS"
            title: "Dismiss"

mode: single